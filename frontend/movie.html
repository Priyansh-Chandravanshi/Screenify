<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details | Screenify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-page">
  <header class="simple-header">
    <a class="logo" href="index.html"><span>S</span> Screenify</a>
    <a class="back-link" href="index.html">Back to movies</a>
  </header>
  <main>
    <p class="notice visible centered" id="message">Loading movie...</p>
    <section class="movie-banner hidden" id="movieBanner">
      <img id="poster" class="poster" alt="">
      <div class="movie-info">
        <p class="eyebrow">Now showing</p>
        <h1 id="title"></h1>
        <p class="movie-meta" id="details"></p>
        <div class="rating-panel">
          <strong id="ratingScore"></strong>
          <span>Audience rating</span>
        </div>
        <div class="formats"><span>2D</span><span>IMAX</span><span>Dolby Audio</span></div>
        <p class="synopsis" id="synopsis"></p>
        <div class="detail-actions">
          <button class="button large" id="bookButton" type="button">Select showtime</button>
          <a class="button ghost large hidden" id="trailerButton" href="#" target="_blank" rel="noopener">Watch trailer</a>
        </div>
      </div>
    </section>
    <section class="movie-deep-dive hidden" id="movieDeepDive">
      <article>
        <p class="eyebrow">About</p>
        <h2>About the movie</h2>
        <p id="aboutMovie"></p>
      </article>
      <article>
        <p class="eyebrow">Cast</p>
        <h2>Cast actors</h2>
        <div class="people-list" id="castList"></div>
      </article>
      <article>
        <p class="eyebrow">Crew</p>
        <h2>Crew</h2>
        <div class="people-list" id="crewList"></div>
      </article>
    </section>
    <section class="review-section hidden" id="reviewSection">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Audience voice</p>
          <h2>Top reviews</h2>
        </div>
      </div>
      <form class="review-form" id="reviewForm">
        <label>Your rating
          <select class="field" id="reviewRating">
            <option value="10">10 - Blockbuster</option>
            <option value="9">9 - Excellent</option>
            <option value="8">8 - Great</option>
            <option value="7">7 - Good</option>
            <option value="6">6 - Decent</option>
          </select>
        </label>
        <label>Comment
          <input class="field" id="reviewText" maxlength="400" placeholder="Write a short review">
        </label>
        <button class="button" type="submit">Post review</button>
      </form>
      <p class="notice" id="reviewMessage"></p>
      <div class="review-grid" id="reviewList"></div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="movie.js"></script>
</body>
</html>
