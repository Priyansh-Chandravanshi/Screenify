<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details | Screenify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-page">
  <header class="simple-header">
    <a class="logo" href="index.html"><span>S</span> Screenify</a>
    <a class="back-link" href="index.html">Back to movies</a>
  </header>
  <main>
    <p class="notice visible centered" id="message">Loading movie...</p>
    <section class="movie-banner hidden" id="movieBanner">
      <div class="poster-shell">
        <img id="poster" class="poster" alt="">
        <button class="trailer-play hidden" id="posterTrailerButton" type="button">
          <span>&#9658;</span> Trailer
        </button>
      </div>
      <div class="movie-info">
        <p class="eyebrow" id="catalogueTag">Now showing</p>
        <h1 id="title"></h1>
        <div class="movie-chips" id="movieChips"></div>
        <div class="score-strip">
          <div class="rating-panel">
            <strong id="ratingScore"></strong>
            <span>Audience rating</span>
          </div>
          <div class="mini-stat">
            <strong id="runtimeValue"></strong>
            <span>Runtime</span>
          </div>
          <div class="mini-stat">
            <strong id="languageValue"></strong>
            <span>Language</span>
          </div>
        </div>
        <p class="movie-meta" id="details"></p>
        <p class="synopsis" id="synopsis"></p>
        <div class="movie-facts" id="movieFacts"></div>
        <div class="formats"><span>2D</span><span>IMAX</span><span>Dolby Audio</span></div>
        <div class="detail-actions">
          <button class="button large" id="bookButton" type="button">Select showtime</button>
          <a class="button ghost large hidden" id="trailerButton" href="#" target="_blank" rel="noopener">Play trailer</a>
        </div>
      </div>
    </section>
    <section class="movie-deep-dive hidden" id="movieDeepDive">
      <article>
        <p class="eyebrow">Story</p>
        <h2>About the movie</h2>
        <p id="aboutMovie"></p>
      </article>
      <article>
        <p class="eyebrow">Cast</p>
        <h2>Top cast</h2>
        <div class="people-list" id="castList"></div>
      </article>
      <article>
        <p class="eyebrow">Crew</p>
        <h2>Direction and crew</h2>
        <div class="people-list" id="crewList"></div>
      </article>
    </section>
    <section class="review-section hidden" id="reviewSection">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Audience voice</p>
          <h2>Top reviews</h2>
        </div>
      </div>
      <form class="review-form" id="reviewForm">
        <label>Your rating
          <select class="field" id="reviewRating">
            <option value="10">10 - Blockbuster</option>
            <option value="9">9 - Excellent</option>
            <option value="8">8 - Great</option>
            <option value="7">7 - Good</option>
            <option value="6">6 - Decent</option>
          </select>
        </label>
        <label>Comment
          <input class="field" id="reviewText" maxlength="400" placeholder="Write a short review">
        </label>
        <button class="button" type="submit">Post review</button>
      </form>
      <p class="notice" id="reviewMessage"></p>
      <div class="review-grid" id="reviewList"></div>
    </section>
    <dialog class="trailer-modal" id="trailerModal">
      <div class="trailer-shell">
        <div class="trailer-modal-head">
          <strong id="trailerTitle">Trailer</strong>
          <button class="icon-button" id="closeTrailer" type="button">Close</button>
        </div>
        <div class="trailer-frame">
          <iframe id="trailerFrame" title="Movie trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <a class="button ghost hidden" id="trailerExternal" href="#" target="_blank" rel="noopener">Open trailer</a>
      </div>
    </dialog>
  </main>
  <script src="app.js"></script>
  <script src="movie.js"></script>
</body>
</html>
