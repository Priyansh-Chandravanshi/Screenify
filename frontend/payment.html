<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Screenify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="surface-page">
  <header class="simple-header light">
    <a class="logo" href="index.html"><span>S</span> Screenify</a>
    <span class="secure-label">Checkout</span>
  </header>
  <main class="checkout-page">
    <form class="payment-card" id="paymentForm">
      <p class="eyebrow">Demo checkout</p>
      <h1>Select payment method</h1>
      <p class="muted">Demo mode: no real payment will be charged.</p>
      <div class="secure-checks">
        <span>Seat lock active</span>
        <span>Instant ticket</span>
        <span>No real charge</span>
      </div>
      <label class="receipt-email">Ticket email
        <input class="field" id="customerEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        <small>Your confirmed ticket will be emailed to this address.</small>
      </label>
      <div class="coupon-box">
        <label>Coupon code
          <input class="field" id="couponCode" placeholder="WELCOME100">
        </label>
        <button class="button ghost" id="applyCoupon" type="button">Apply</button>
      </div>
      <p class="coupon-message" id="couponMessage"></p>
      <div class="payment-methods" role="radiogroup">
        <label class="payment-option active"><input type="radio" name="method" value="upi" checked> UPI</label>
        <label class="payment-option"><input type="radio" name="method" value="card"> Card</label>
        <label class="payment-option"><input type="radio" name="method" value="netbanking"> Net Banking</label>
      </div>
      <div class="payment-fields" id="upi">
        <label>UPI ID<input class="field" name="upi" placeholder="yourname@bank"></label>
      </div>
      <div class="payment-fields hidden" id="card">
        <label>Card number<input class="field" name="cardNumber" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456"></label>
        <div class="two-fields">
          <label>Expiry<input class="field" name="expiry" placeholder="MM/YY"></label>
          <label>CVV<input class="field" name="cvv" inputmode="numeric" maxlength="3" placeholder="123"></label>
        </div>
      </div>
      <div class="payment-fields hidden" id="netbanking">
        <label>Bank<select class="field" name="bank"><option value="">Choose bank</option><option>HDFC Bank</option><option>ICICI Bank</option><option>State Bank of India</option><option>Axis Bank</option></select></label>
      </div>
      <p class="notice" id="paymentMessage"></p>
      <button class="button block large" id="payButton" type="submit">Confirm booking</button>
    </form>
    <aside class="order-card" id="orderCard">
      <h2>Order summary</h2>
      <h3 id="movieName"></h3>
      <p class="muted" id="showMeta"></p>
      <div class="order-row"><span>Convenience fee</span><strong>Included</strong></div>
      <div class="order-row"><span>Coupon discount</span><strong id="discount">INR 0</strong></div>
      <div class="order-row"><span>Seats</span><strong id="seatList"></strong></div>
      <div class="order-row total"><span>Total</span><strong id="amount"></strong></div>
    </aside>
  </main>
  <div class="processing hidden" id="processing" aria-live="polite">
    <div class="payment-animation">
      <div class="pay-card">
        <span></span>
        <strong id="animationAmount">INR 0</strong>
      </div>
      <div class="pay-wave"></div>
      <div class="pay-check">✓</div>
    </div>
    <p id="processingText">Confirming your seats...</p>
    <div class="processing-steps">
      <span class="active">Payment</span>
      <span>Seat lock</span>
      <span>Ticket</span>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="payment.js"></script>
</body>
</html>
